[theme]
base = "dark"
primaryColor = "#7c8cff"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#151b2a"
textColor = "#f1f4fb"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
